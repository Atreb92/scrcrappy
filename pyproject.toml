[project]
name = "scrcrappy"
version = "0.2.0"
description = "scrcpy for iOS"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["av", "numpy", "pygame-ce", "pyusb"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
scrcrappy = "scrcrappy.__main__:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["scrcrappy"]

[tool.setuptools.package-data]
scrcrappy = ["icons/*", "bin/qvh", "bin/qvh-LICENSES.txt"]
