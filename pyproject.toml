[project]
name = "scrcrappy"
version = "0.5.0"
description = "scrcpy for iOS"
readme = "README.md"
authors = [{ name = "atreb92" }]
keywords = ["ios", "iphone", "screen-mirroring", "scrcpy", "assistivetouch"]
classifiers = [
    "Environment :: X11 Applications",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Video :: Display",
]
license = "MIT"
requires-python = ">=3.11"
dependencies = ["av", "numpy", "pygame-ce", "pyusb"]

[project.optional-dependencies]
dev = ["pytest"]

[project.urls]
Homepage = "https://github.com/atreb92/scrcrappy"
Issues = "https://github.com/atreb92/scrcrappy/issues"

[project.scripts]
scrcrappy = "scrcrappy.__main__:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["scrcrappy"]

[tool.setuptools.package-data]
scrcrappy = ["icons/*", "fonts/*", "bin/qvh", "bin/qvh-LICENSES.txt"]
