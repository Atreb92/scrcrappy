; scrcrappy BLE mouse firmware. Build + flash: pio run -e esp32dev -t upload
; Pick the env matching your board; all need Bluetooth LE (ESP32, -C3, -S3; not ESP8266/-S2).
; Boards with only the chip's native USB port (no CP210x/CH340), e.g. C3 "SuperMini", also need:
;   build_flags = -DARDUINO_USB_CDC_ON_BOOT=1
[env]
platform = espressif32@6.9.0
framework = arduino
lib_deps = h2zero/NimBLE-Arduino@2.3.2
monitor_speed = 115200

[env:esp32dev]
board = esp32dev

[env:esp32-c3]
board = esp32-c3-devkitm-1

[env:esp32-s3]
board = esp32-s3-devkitc-1

; Debug builds: the same firmware plus extra "dbg" lines (link parameters, MTU, PHY, counters, free heap).
; Flash one only to collect data for a bug report: pio run -e esp32dev-debug -t upload
[env:esp32dev-debug]
extends = env:esp32dev
build_flags = -DSCRCRAPPY_DEBUG=1

[env:esp32-c3-debug]
extends = env:esp32-c3
build_flags = -DSCRCRAPPY_DEBUG=1

[env:esp32-s3-debug]
extends = env:esp32-s3
build_flags = -DSCRCRAPPY_DEBUG=1
