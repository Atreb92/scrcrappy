# Tag v<version> -> Linux x86_64 wheel with the patched qvh inside, attached to a GitHub release.
# UNTESTED: written before the repo was on GitHub (see docs/releasing.md).
name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:  # re-run just the homebrew job for an existing tag
    inputs:
      tag:
        description: tag to publish to the tap, e.g. v0.2.1
        required: true
permissions:
  contents: write
jobs:
  linux-wheel:
    if: github.event_name == 'push'
    runs-on: ubuntu-22.04  # glibc 2.35: the wheel is tagged manylinux_2_35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"  # before the tag check: the runner's python3 3.10 has no tomllib
      - name: Tag matches pyproject version
        run: |
          version=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "$GITHUB_REF_NAME" = "v$version" || { echo "tag $GITHUB_REF_NAME != v$version"; exit 1; }
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: sudo apt-get update && sudo apt-get install -y libusb-1.0-0-dev pkg-config
      - run: sh scripts/build-qvh.sh
      - run: pip install build wheel pytest . && SDL_VIDEODRIVER=dummy pytest -q
      - run: python -m build --wheel
      - name: Wheel ships qvh and its licences
        run: unzip -l dist/*.whl | grep -q "scrcrappy/bin/qvh$" && unzip -l dist/*.whl | grep -q qvh-LICENSES.txt
      - run: python -m wheel tags --python-tag py3 --abi-tag none --platform-tag manylinux_2_35_x86_64 --remove dist/*.whl
      - run: gh release create "$GITHUB_REF_NAME" dist/*.whl --title "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
  homebrew:
    # UNTESTED. Needs the repo secret TAP_DEPLOY_KEY: the private half of a write deploy key on atreb92/homebrew-scrcrappy.
    needs: linux-wheel
    if: ${{ !cancelled() && (needs.linux-wheel.result == 'success' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-22.04
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: atreb92/homebrew-scrcrappy
          ssh-key: ${{ secrets.TAP_DEPLOY_KEY }}
          path: tap
      - name: Point the formula at this tag
        run: |
          url="https://github.com/${{ github.repository }}/archive/refs/tags/$TAG.tar.gz"
          sha=$(curl -sL "$url" | sha256sum | cut -d' ' -f1)
          mkdir -p tap/Formula
          sed -e "s|^  url \"https://github.com/.*/archive/.*|  url \"$url\"|" -e "s|^  sha256 \".*|  sha256 \"$sha\"|" \
            packaging/scrcrappy.rb > tap/Formula/scrcrappy.rb
          grep -q "$sha" tap/Formula/scrcrappy.rb
      - name: Push to the tap
        working-directory: tap
        run: |
          git config user.name "github-actions" && git config user.email "actions@users.noreply.github.com"
          git add Formula/scrcrappy.rb
          git diff --cached --quiet && { echo "formula already at $TAG"; git push --dry-run; exit 0; }  # still proves the key can write
          git commit -m "scrcrappy $TAG" && git push
